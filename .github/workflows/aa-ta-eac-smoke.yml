name: AA / TA / EAC smoke

# Fast reviewer gate: AA bilateral + TA/EAC JMRTD SW-proxy + gmrtd unsupported.
# Does not run the 200-run PACE sweep (see jmrtd-sweep.yml).

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'jmrtd-sweep-*'
  pull_request:
    branches:
      - main

jobs:
  aa-ta-eac-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bootstrap vendored gmrtd + JMRTD sources
        run: bash scripts/bootstrap-vendor.sh

      - name: Compile JMRTD locally
        run: bash scripts/install-jmrtd-local.sh

      - name: Package JMRTD harness jar
        working-directory: drivers/jmrtd
        run: mvn -q -Dmaven.test.skip=true package

      - name: Unit tests (classifiers + middleware + normfail)
        run: |
          go test ./classifier/ ./middleware/ ./internal/normfail/
          pip install --break-system-packages -r classifier/requirements-verify.txt
          (cd classifier && python3 -m unittest test_observability test_schemas -v)
          (cd drivers/jmrtd && mvn -q test)

      - name: AA + TA/EAC smoke (+ gmrtd unsupported)
        run: |
          chmod +x scripts/verify_aa_ta_eac_smoke.sh
          LOG_DIR=logs/aa-ta-eac-smoke bash scripts/verify_aa_ta_eac_smoke.sh

      - name: AA 20-run SW grid (bilateral corroborating)
        run: |
          chmod +x scripts/run_aa_sweep_full.sh
          python3 profiles/generate_aa_sweep.py
          LOG_DIR=logs/aa-01-sweep-ci bash scripts/run_aa_sweep_full.sh

      - name: Middleware overhead sample
        run: go test ./middleware/ -run TestMiddlewareOverheadSample -count=1 -v

      - name: PA combinatorial offline grid (≥24)
        run: |
          pip install --break-system-packages cryptography asn1crypto git+https://github.com/ZeroPass/pymrtd.git@v0.6.6
          chmod +x scripts/run_pa_sweep_full.sh
          python3 profiles/generate_pa_sweep.py
          LOG_DIR=logs/pa-sweep-ci bash scripts/run_pa_sweep_full.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa-ta-eac-smoke-results
          path: |
            logs/aa-ta-eac-smoke/
            logs/aa-01-sweep-ci/
            logs/pa-sweep-ci/
          retention-days: 90
