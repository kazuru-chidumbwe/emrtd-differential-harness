name: AA / TA / EAC smoke

# Fast reviewer gate: AA bilateral + TA/EAC JMRTD SW-proxy + gmrtd unsupported.
# Does not run the 200-run PACE sweep (see jmrtd-sweep.yml).

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'jmrtd-sweep-*'

jobs:
  aa-ta-eac-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bootstrap vendored gmrtd + JMRTD sources
        run: bash scripts/bootstrap-vendor.sh

      - name: Compile JMRTD locally
        run: bash scripts/install-jmrtd-local.sh

      - name: Package JMRTD harness jar
        working-directory: drivers/jmrtd
        run: mvn -q -DskipTests package

      - name: Unit tests (classifiers + middleware + normfail)
        run: |
          go test ./classifier/ ./middleware/ ./internal/normfail/
          (cd classifier && python3 -m unittest test_observability -v)
          (cd drivers/jmrtd && mvn -q test)

      - name: AA + TA/EAC smoke (+ gmrtd unsupported)
        run: |
          chmod +x scripts/verify_aa_ta_eac_smoke.sh
          LOG_DIR=logs/aa-ta-eac-smoke bash scripts/verify_aa_ta_eac_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aa-ta-eac-smoke-results
          path: logs/aa-ta-eac-smoke/
          retention-days: 90
